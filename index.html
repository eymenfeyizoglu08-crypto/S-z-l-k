<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Türkçe Sözlüğüm</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}header{background:#2563eb;color:#fff;text-align:center;padding:25px 15px}.container{max-width:900px;margin:auto;padding:20px}.search{width:100%;padding:15px;border:1px solid #ddd;border-radius:12px;font-size:17px}.letters{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}.letters button{border:0;border-radius:8px;padding:9px 12px;background:#e5e7eb}.word{background:#fff;border-radius:12px;padding:15px;margin:10px 0;box-shadow:0 2px 8px #0001}.word b{color:#2563eb;font-size:19px}#count{color:#666}</style></head><body><header><h1>📖 Türkçe Sözlüğüm</h1><p>Kelimeleri ara ve anlamlarını öğren.</p></header><div class="container"><input id="search" class="search" placeholder="Kelime ara..."><div id="letters" class="letters"></div><div id="count"></div><div id="words"></div></div><script>const letters=["A","B","C","Ç","D","E","F","G","Ğ","H","I","İ","J","K","L","M","N","O","Ö","P","R","S","Ş","T","U","Ü","V","Y","Z"];const data=[["araba","İnsanların ulaşımını sağlayan motorlu taşıt."],["ağaç","Gövdesi odunsu olan bitki."],["akıl","Düşünme ve anlama yeteneği."],["arkadaş","Birbirine sevgi ve yakınlık duyan kimse."],["başarı","Bir işi istenilen biçimde sonuçlandırma."],["bilgi","Öğrenme yoluyla elde edilen bilgi."],["çalışmak","Bir işi yapmak için emek harcamak."],["çevre","Bir şeyi kuşatan alan."],["doğa","Canlı ve cansız varlıkların oluşturduğu ortam."],["dost","Sevilen ve güvenilen yakın kimse."],["eğitim","Bilgi ve beceri kazandırma süreci."],["ev","İnsanların yaşadığı yapı."],["fikir","Bir konu hakkındaki düşünce."],["güneş","Dünya'ya ışık ve ısı veren yıldız."],["hayal","Zihinde tasarlanan düşünce."],["ışık","Cisimleri görmemizi sağlayan enerji."],["insan","Düşünebilen canlı."],["kitap","Bilgi veya düşünceleri içeren yazılı eser."],["mutluluk","Sevinç ve hoşnutluk duygusu."],["okul","Eğitim ve öğretimin yapıldığı kurum."],["sevgi","Bir varlığa karşı duyulan güçlü bağlılık."],["sözlük","Kelimelerin anlamlarını açıklayan eser."],["umut","İyi bir şeyin gerçekleşmesini bekleme duygusu."],["vatan","Bir milletin üzerinde yaşadığı toprak."],["yazı","Duygu ve düşüncelerin yazıyla anlatılması."],["zaman","Olayların ilerlediği süreç."]];const words=document.getElementById('words'),search=document.getElementById('search'),count=document.getElementById('count');function render(list){words.innerHTML='';count.textContent=list.length+' kelime gösteriliyor';list.forEach(x=>words.innerHTML+=`<div class="word"><b>${x[0]}</b><br>${x[1]}</div>`)}letters.forEach(l=>{let b=document.createElement('button');b.textContent=l;b.onclick=()=>render(data.filter(x=>x[0].toLocaleUpperCase('tr-TR').startsWith(l)));document.getElementById('letters').appendChild(b)});search.oninput=()=>{let q=search.value.toLocaleLowerCase('tr-TR');render(data.filter(x=>x[0].toLocaleLowerCase('tr-TR').includes(q)))};render(data);</script></body></html>
